id: ThroughTheMire
title: throughTheMireTitle
description: throughTheMireDescription
ruleset:
  id: ThroughTheMireRuleset
  inherits: DefaultCampaign
  timeoutLength: 30 # cutscenes pause it (see the script)
  factionData:
    sanghoy:
      startingData:
        resources:
          g: 0
          u: 3 # one of Kagaalu's sarcomancies
        cards: { }
        units: [ ] # the script brings Kagaalu's band and claims everyone else on the map
      upgradeTree:
        nodes: [ ]
  bans:
    skills: # no base and no economy: the band grows on the march
      - sanghoyCampGenerateGold
      - trainThrall
      - trainWarrior
      - trainSarcomancer
      - trainShaper
      - addBloodlust
      - addMajorUpgrade
      - addMinorUpgrade
      - buildSanghoyCamp
      - buildWarCouncil
      - buildTotem
      - buildRunestoneOfRogash
      - buildSacrificialWell
      - mineGold
      - pillage
      - riseToWarchief
      - sarcomancy # the Stitcher would only carve himself up with it
      - amalgamation
    stances:
      - March
players:
  - name: Player
    color: red
    team: 1
    faction: sanghoy
  - name: Pyracmon's tribes
    color: purple
    team: 2
    faction: sanghoy
    ai: TerritorialAi
  - name: Outcasts of Moheela
    color: green
    team: 3
    faction: sanghoy
    ai: TerritorialAi
  - name: Captives
    color: yellow
    team: 2 # on Pyracmon's side until freed, so his guards leave them alone
    faction: sanghoy
    ai: PassiveAi
